<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2048 Cyber</title>
  <style>
    :root {
      --bg-black: #08080e;
      --surface-dark: #12121d;
      --surface-card: #1b1b2a;
      --border-color: #2e2e48;
      --neon-purple: #a855f7;
      --neon-cyan: #00f0ff;
      --neon-pink: #ff007f;
      --neon-red: #ff2a6d;
      --neon-green: #00ff66;
      --neon-amber: #ffb800;
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-black);
      color: var(--text-primary);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      touch-action: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-title h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
    }

    .logo-title p {
      font-size: 11px;
      color: var(--text-secondary);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .scores-container {
      display: flex;
      gap: 10px;
    }

    .score-box {
      background: var(--surface-dark);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 8px 14px;
      text-align: center;
      min-width: 80px;
    }

    .score-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--neon-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .score-value {
      font-size: 18px;
      font-weight: 900;
      color: var(--text-primary);
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
      transition: transform 0.1s, opacity 0.2s;
      position: relative;
      z-index: 20;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .game-board {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--surface-dark);
      border: 2px solid var(--border-color);
      border-radius: 20px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(168, 85, 247, 0.2);
      touch-action: none;
    }

    .grid-cell {
      background: var(--surface-card);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tile {
      position: absolute;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 900;
      transition: all 0.12s ease-in-out;
      box-shadow: 0 0 12px currentColor;
    }

    .tile-new {
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .tile-merged {
      animation: pulseMerge 0.2s ease-in-out;
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes pulseMerge {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* Neon Tile Colors */
    .tile-2 { background: #12121d; color: var(--neon-cyan); border: 2px solid var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan); }
    .tile-4 { background: #12121d; color: #38bdf8; border: 2px solid #38bdf8; text-shadow: 0 0 8px #38bdf8; }
    .tile-8 { background: #1b1b2a; color: var(--neon-purple); border: 2px solid var(--neon-purple); text-shadow: 0 0 10px var(--neon-purple); }
    .tile-16 { background: #1b1b2a; color: var(--neon-pink); border: 2px solid var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }
    .tile-32 { background: #2a1b26; color: var(--neon-red); border: 2px solid var(--neon-red); text-shadow: 0 0 12px var(--neon-red); }
    .tile-64 { background: #2a221b; color: var(--neon-amber); border: 2px solid var(--neon-amber); text-shadow: 0 0 12px var(--neon-amber); }
    .tile-128 { background: #1b2a20; color: var(--neon-green); border: 2px solid var(--neon-green); text-shadow: 0 0 15px var(--neon-green); font-size: 22px; }
    .tile-256 { background: var(--neon-purple); color: #fff; border: 2px solid #c084fc; text-shadow: 0 0 15px #fff; font-size: 22px; box-shadow: 0 0 20px var(--neon-purple); }
    .tile-512 { background: var(--neon-cyan); color: #08080e; border: 2px solid #fff; text-shadow: 0 0 10px #08080e; font-size: 22px; box-shadow: 0 0 20px var(--neon-cyan); }
    .tile-1024 { background: var(--neon-pink); color: #fff; border: 2px solid #fff; text-shadow: 0 0 15px #fff; font-size: 18px; box-shadow: 0 0 25px var(--neon-pink); }
    .tile-2048 { background: linear-gradient(135deg, var(--neon-amber), var(--neon-red)); color: #fff; border: 2px solid #fff; font-size: 18px; box-shadow: 0 0 30px var(--neon-amber); animation: pulseMerge 1s infinite alternate; }

    /* Overlay Screens */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(8, 8, 14, 0.92);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .win .overlay-title { color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green); }
    .gameover .overlay-title { color: var(--neon-red); text-shadow: 0 0 15px var(--neon-red); }

    .instructions {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-title">
        <h1>2048 CYBER</h1>
        <p>JOIN THE NEON TILES</p>
      </div>
      <div class="scores-container">
        <div class="score-box">
          <div class="score-label">SCORE</div>
          <div class="score-value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="score-label">BEST</div>
          <div class="score-value" id="bestScore">0</div>
        </div>
      </div>
    </header>

    <div class="controls-bar">
      <div class="instructions">SWIPE ANYWHERE ON SCREEN OR USE ARROWS</div>
      <button class="btn" onclick="restartGame()">NEW GAME</button>
    </div>

    <div class="game-board" id="board">
      <!-- 16 Grid background slots -->
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>

      <!-- Game Over / Win Overlays -->
      <div class="overlay gameover" id="gameOverOverlay">
        <div class="overlay-title">SYSTEM OVERLOAD</div>
        <div style="color: var(--text-secondary); font-size: 13px;">NO MORE VALID MOVES</div>
        <button class="btn" onclick="restartGame()">REBOOT SYSTEM</button>
      </div>

      <div class="overlay win" id="winOverlay">
        <div class="overlay-title">CYBER VICTORY!</div>
        <div style="color: var(--text-secondary); font-size: 13px;">YOU REACHED TILE 2048</div>
        <button class="btn" onclick="keepPlaying()">KEEP PLAYING</button>
        <button class="btn" style="background: var(--surface-card);" onclick="restartGame()">NEW GAME</button>
      </div>
    </div>
  </div>

  <script>
    const SIZE = 4;
    let grid = [];
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('2048_cyber_best') || '0', 10);
    let won = false;
    let keepPlayingFlag = false;

    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const bestScoreEl = document.getElementById('bestScore');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const winOverlay = document.getElementById('winOverlay');

    bestScoreEl.innerText = bestScore;

    function initGame() {
      grid = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
      score = 0;
      won = false;
      keepPlayingFlag = false;
      scoreEl.innerText = '0';
      gameOverOverlay.classList.remove('active');
      winOverlay.classList.remove('active');

      // Clear existing tiles
      const oldTiles = document.querySelectorAll('.tile');
      oldTiles.forEach(tile => tile.remove());

      spawnTile();
      spawnTile();
      renderBoard();
    }

    function spawnTile() {
      let emptyCells = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] === 0) emptyCells.push({r, c});
        }
      }
      if (emptyCells.length === 0) return;

      const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      grid[randomCell.r][randomCell.c] = Math.random() < 0.9 ? 2 : 4;
    }

    function renderBoard() {
      // Remove old tile elements
      const existingTiles = document.querySelectorAll('.tile');
      existingTiles.forEach(t => t.remove());

      const boardRect = boardEl.getBoundingClientRect();
      const padding = 12;
      const gap = 10;
      const cellSize = (boardRect.width - (padding * 2) - (gap * (SIZE - 1))) / SIZE;

      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const val = grid[r][c];
          if (val > 0) {
            const tile = document.createElement('div');
            tile.className = `tile tile-${val}`;
            tile.innerText = val;

            const left = padding + c * (cellSize + gap);
            const top = padding + r * (cellSize + gap);

            tile.style.width = `${cellSize}px`;
            tile.style.height = `${cellSize}px`;
            tile.style.left = `${left}px`;
            tile.style.top = `${top}px`;

            boardEl.appendChild(tile);
          }
        }
      }
    }

    function slideRow(row) {
      let arr = row.filter(val => val !== 0);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          score += arr[i];
          arr[i + 1] = 0;
          if (arr[i] === 2048 && !won && !keepPlayingFlag) {
            won = true;
          }
        }
      }
      arr = arr.filter(val => val !== 0);
      while (arr.length < SIZE) {
        arr.push(0);
      }
      return arr;
    }

    function moveLeft() {
      let moved = false;
      for (let r = 0; r < SIZE; r++) {
        const original = [...grid[r]];
        const next = slideRow(grid[r]);
        grid[r] = next;
        if (original.some((val, idx) => val !== next[idx])) moved = true;
      }
      return moved;
    }

    function rotateBoard() {
      let newGrid = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          newGrid[c][SIZE - 1 - r] = grid[r][c];
        }
      }
      grid = newGrid;
    }

    function move(dir) {
      // 0: Left, 1: Down, 2: Right, 3: Up
      let moved = false;
      for (let i = 0; i < dir; i++) rotateBoard();
      moved = moveLeft();
      for (let i = 0; i < (4 - dir) % 4; i++) rotateBoard();

      if (moved) {
        spawnTile();
        updateScore();
        renderBoard();
        checkGameStatus();
      }
    }

    function updateScore() {
      scoreEl.innerText = score;
      if (score > bestScore) {
        bestScore = score;
        bestScoreEl.innerText = bestScore;
        localStorage.setItem('2048_cyber_best', bestScore);
      }
    }

    function checkGameStatus() {
      if (won && !keepPlayingFlag) {
        winOverlay.classList.add('active');
        return;
      }

      // Check for available moves
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] === 0) return;
          if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return;
          if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return;
        }
      }

      gameOverOverlay.classList.add('active');
    }

    function keepPlaying() {
      keepPlayingFlag = true;
      winOverlay.classList.remove('active');
    }

    function restartGame() {
      initGame();
    }

    // Keyboard Navigation
    window.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowLeft': case 'a': case 'A': move(0); break;
        case 'ArrowDown': case 's': case 'S': move(1); break;
        case 'ArrowRight': case 'd': case 'D': move(2); break;
        case 'ArrowUp': case 'w': case 'W': move(3); break;
      }
    });

    // Global Viewport Touch Swipe Controls for Android
    let touchStartX = 0;
    let touchStartY = 0;
    let isTouching = false;

    window.addEventListener('touchstart', e => {
      if (e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        isTouching = true;
      }
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      if (!isTouching) return;
      // Prevent screen scrolling or pull-to-refresh overscroll
      if (e.cancelable) {
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', e => {
      if (!isTouching) return;
      isTouching = false;

      if (e.changedTouches.length === 0) return;

      const endX = e.changedTouches[0].clientX;
      const endY = e.changedTouches[0].clientY;

      const dx = endX - touchStartX;
      const dy = endY - touchStartY;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);

      // Minimum swipe threshold (30px) to differentiate intentional swipes from taps
      const SWIPE_THRESHOLD = 30;

      if (absDx >= SWIPE_THRESHOLD || absDy >= SWIPE_THRESHOLD) {
        if (absDx > absDy) {
          if (dx > 0) {
            move(2); // Right
          } else {
            move(0); // Left
          }
        } else {
          if (dy > 0) {
            move(1); // Down
          } else {
            move(3); // Up
          }
        }
      }

      touchStartX = 0;
      touchStartY = 0;
    }, { passive: false });

    window.addEventListener('touchcancel', () => {
      isTouching = false;
      touchStartX = 0;
      touchStartY = 0;
    });

    // Mouse drag support for emulator preview
    let mouseStartX = 0;
    let mouseStartY = 0;
    let isMouseDown = false;

    window.addEventListener('mousedown', e => {
      if (e.target.closest('button, .btn')) return;
      mouseStartX = e.clientX;
      mouseStartY = e.clientY;
      isMouseDown = true;
    });

    window.addEventListener('mouseup', e => {
      if (!isMouseDown) return;
      isMouseDown = false;

      const dx = e.clientX - mouseStartX;
      const dy = e.clientY - mouseStartY;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);

      if (absDx >= 30 || absDy >= 30) {
        if (absDx > absDy) {
          if (dx > 0) move(2); else move(0);
        } else {
          if (dy > 0) move(1); else move(3);
        }
      }
    });

    window.addEventListener('resize', renderBoard);

    // Launch game
    initGame();
  </script>
</body>
</html>
