<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devil Game Hub - Admin Dashboard</title>
  <style>
    :root {
      --bg-black: #08080e;
      --surface-dark: #12121d;
      --surface-card: #1b1b2a;
      --border-color: #2e2e48;
      --neon-purple: #a855f7;
      --neon-cyan: #00f0ff;
      --neon-pink: #ff007f;
      --neon-red: #ff2a6d;
      --neon-green: #00ff66;
      --neon-amber: #ffb800;
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-primary);
      padding: 24px;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
    }

    .logo-title h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .logo-title h1 span:first-child { color: var(--neon-purple); }
    .logo-title h1 span:last-child { color: var(--neon-cyan); }
    .logo-title p {
      font-size: 11px;
      color: var(--text-secondary);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .config-panel {
      background: var(--surface-dark);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .config-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--neon-cyan);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      background: var(--surface-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--neon-cyan);
    }

    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan));
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

    .btn-secondary {
      background: var(--surface-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover { border-color: var(--neon-purple); }

    .btn-danger {
      background: var(--neon-red);
      color: #fff;
    }

    .games-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .game-card {
      background: var(--surface-dark);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .game-thumb {
      height: 140px;
      width: 100%;
      object-fit: cover;
      background: var(--surface-card);
    }

    .game-body {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .game-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .game-meta {
      font-size: 11px;
      color: var(--neon-purple);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .game-desc {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      flex: 1;
    }

    .badges {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
    }
    .badge-featured { background: rgba(168, 85, 247, 0.2); color: var(--neon-purple); border: 1px solid var(--neon-purple); }
    .badge-popular { background: rgba(0, 240, 255, 0.2); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-content {
      background: var(--surface-dark);
      border: 1px solid var(--neon-purple);
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }

    .status-banner {
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 12px;
      display: none;
    }
    .status-success { background: rgba(0, 255, 102, 0.15); color: var(--neon-green); border: 1px solid var(--neon-green); }
    .status-error { background: rgba(255, 42, 109, 0.15); color: var(--neon-red); border: 1px solid var(--neon-red); }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <div class="logo-badge">😈</div>
      <div class="logo-title">
        <h1><span>DEVIL GAME HUB</span> <span>ADMIN</span></h1>
        <p>GitHub API Dynamic Database Dashboard</p>
      </div>
    </div>
    <div>
      <button class="btn-primary" onclick="openGameModal()">+ Add New Game</button>
    </div>
  </header>

  <!-- GitHub Repository Configuration Panel -->
  <div class="config-panel">
    <div class="config-title">⚙️ GitHub Repository Credentials & API Connection</div>
    <div class="grid-4">
      <div class="input-group">
        <label>GitHub Owner / Username</label>
        <input type="text" id="ghOwner" placeholder="e.g. devilgamehub">
      </div>
      <div class="input-group">
        <label>Repository Name</label>
        <input type="text" id="ghRepo" placeholder="e.g. games-db">
      </div>
      <div class="input-group">
        <label>Branch Name</label>
        <input type="text" id="ghBranch" value="main">
      </div>
      <div class="input-group">
        <label>JSON File Path</label>
        <input type="text" id="ghPath" value="games.json">
      </div>
    </div>

    <div class="input-group" style="margin-bottom: 14px;">
      <label>GitHub Personal Access Token (PAT) — Never stored in APK!</label>
      <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx">
    </div>

    <div class="btn-row">
      <button class="btn-primary" onclick="fetchGamesFromGitHub()">🔄 Load / Fetch Games</button>
      <button class="btn-secondary" onclick="saveCredentials()">💾 Save Credentials (Local Storage)</button>
      <button class="btn-secondary" onclick="exportJson()">📥 Export JSON</button>
    </div>

    <div id="statusBanner" class="status-banner"></div>
  </div>

  <!-- Games Catalog Section -->
  <div class="games-header">
    <h2>Game Catalog (<span id="gameCount">0</span>)</h2>
    <button class="btn-primary" style="background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));" onclick="commitToGitHub()">🚀 Publish / Commit to GitHub</button>
  </div>

  <div class="games-grid" id="gamesGrid"></div>

  <!-- Add / Edit Game Modal -->
  <div class="modal-overlay" id="gameModal">
    <div class="modal-content">
      <h3 id="modalTitle" style="margin-bottom: 16px; color: var(--neon-purple);">Add New Game</h3>

      <form id="gameForm" onsubmit="saveGame(event)">
        <input type="hidden" id="editGameId">

        <div class="input-group" style="margin-bottom: 12px;">
          <label>Game Unique ID</label>
          <input type="text" id="gameId" required placeholder="game_my_title">
        </div>

        <div class="input-group" style="margin-bottom: 12px;">
          <label>Title</label>
          <input type="text" id="gameTitle" required placeholder="Neon Space Shooter">
        </div>

        <div class="input-group" style="margin-bottom: 12px;">
          <label>Description</label>
          <textarea id="gameDesc" rows="2" placeholder="Brief explanation of controls and gameplay mechanics..."></textarea>
        </div>

        <div class="grid-4" style="margin-bottom: 12px;">
          <div class="input-group">
            <label>Category</label>
            <select id="gameCategory">
              <option value="Arcade">Arcade</option>
              <option value="Action">Action</option>
              <option value="Puzzle">Puzzle</option>
              <option value="Retro">Retro</option>
              <option value="Racing">Racing</option>
              <option value="Sports">Sports</option>
              <option value="Strategy">Strategy</option>
            </select>
          </div>
          <div class="input-group">
            <label>Orientation</label>
            <select id="gameOrientation">
              <option value="portrait">Portrait</option>
              <option value="landscape">Landscape</option>
              <option value="any">Any</option>
            </select>
          </div>
        </div>

        <div class="input-group" style="margin-bottom: 12px;">
          <label>Thumbnail Image URL</label>
          <input type="url" id="gameThumb" required placeholder="https://images.unsplash.com/...">
        </div>

        <div class="input-group" style="margin-bottom: 12px;">
          <label>Game URL (HTML5 / Web Link)</label>
          <input type="url" id="gameUrl" required placeholder="https://play2048.co/">
        </div>

        <div class="grid-4" style="margin-bottom: 16px;">
          <div class="input-group">
            <label>Rating (1.0 - 5.0)</label>
            <input type="number" step="0.1" id="gameRating" value="4.8">
          </div>
          <div class="input-group">
            <label>Featured?</label>
            <select id="gameFeatured">
              <option value="false">No</option>
              <option value="true">Yes (Top Slider)</option>
            </select>
          </div>
          <div class="input-group">
            <label>Popular?</label>
            <select id="gamePopular">
              <option value="true">Yes</option>
              <option value="false">No</option>
            </select>
          </div>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn-primary">Save to Catalog</button>
          <button type="button" class="btn-secondary" onclick="closeGameModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentCatalog = {
      version: 1,
      lastUpdated: new Date().toISOString().split('T')[0],
      games: []
    };
    let currentFileSha = null;

    window.onload = function() {
      loadSavedCredentials();
    };

    function loadSavedCredentials() {
      document.getElementById('ghOwner').value = localStorage.getItem('ghOwner') || '';
      document.getElementById('ghRepo').value = localStorage.getItem('ghRepo') || '';
      document.getElementById('ghBranch').value = localStorage.getItem('ghBranch') || 'main';
      document.getElementById('ghPath').value = localStorage.getItem('ghPath') || 'games.json';
      document.getElementById('ghToken').value = localStorage.getItem('ghToken') || '';
    }

    function saveCredentials() {
      localStorage.setItem('ghOwner', document.getElementById('ghOwner').value.trim());
      localStorage.setItem('ghRepo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('ghBranch', document.getElementById('ghBranch').value.trim());
      localStorage.setItem('ghPath', document.getElementById('ghPath').value.trim());
      localStorage.setItem('ghToken', document.getElementById('ghToken').value.trim());
      showStatus('Credentials saved to browser local storage!', 'success');
    }

    function showStatus(msg, type) {
      const banner = document.getElementById('statusBanner');
      banner.style.display = 'block';
      banner.className = 'status-banner ' + (type === 'success' ? 'status-success' : 'status-error');
      banner.innerText = msg;
    }

    async function fetchGamesFromGitHub() {
      saveCredentials();
      const owner = document.getElementById('ghOwner').value.trim();
      const repo = document.getElementById('ghRepo').value.trim();
      const path = document.getElementById('ghPath').value.trim();
      const branch = document.getElementById('ghBranch').value.trim();
      const token = document.getElementById('ghToken').value.trim();

      if (!owner || !repo || !path) {
        showStatus('Please enter Owner, Repo, and File Path.', 'error');
        return;
      }

      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;
      const headers = {};
      if (token) headers['Authorization'] = `token ${token}`;

      try {
        const res = await fetch(url, { headers });
        if (!res.ok) throw new Error(`GitHub HTTP ${res.status}: ${res.statusText}`);
        const data = await res.json();
        currentFileSha = data.sha;
        const decodedContent = decodeURIComponent(escape(atob(data.content)));
        currentCatalog = JSON.parse(decodedContent);
        renderGames();
        showStatus(`Loaded ${currentCatalog.games.length} games successfully from GitHub!`, 'success');
      } catch (err) {
        showStatus(`Failed to fetch from GitHub: ${err.message}`, 'error');
      }
    }

    function renderGames() {
      const grid = document.getElementById('gamesGrid');
      document.getElementById('gameCount').innerText = currentCatalog.games.length;
      grid.innerHTML = '';

      currentCatalog.games.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <img class="game-thumb" src="${game.thumbnailUrl || 'https://images.unsplash.com/photo-1550745165-9bc0b252726f'}" alt="${game.title}">
          <div class="game-body">
            <div class="game-meta">${game.category} • ⭐ ${game.rating || '4.5'}</div>
            <div class="game-title">${game.title}</div>
            <div class="game-desc">${game.description || ''}</div>
            <div class="badges">
              ${game.isFeatured ? '<span class="badge badge-featured">FEATURED</span>' : ''}
              ${game.isPopular ? '<span class="badge badge-popular">POPULAR</span>' : ''}
            </div>
            <div class="card-actions">
              <button class="btn-secondary" style="flex:1" onclick="editGame('${game.id}')">✏️ Edit</button>
              <button class="btn-danger" onclick="deleteGame('${game.id}')">🗑️ Delete</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openGameModal(editId = null) {
      document.getElementById('gameModal').style.display = 'flex';
      if (editId) {
        const game = currentCatalog.games.find(g => g.id === editId);
        if (game) {
          document.getElementById('modalTitle').innerText = 'Edit Game';
          document.getElementById('editGameId').value = game.id;
          document.getElementById('gameId').value = game.id;
          document.getElementById('gameId').disabled = true;
          document.getElementById('gameTitle').value = game.title;
          document.getElementById('gameDesc').value = game.description || '';
          document.getElementById('gameCategory').value = game.category || 'Arcade';
          document.getElementById('gameOrientation').value = game.orientation || 'portrait';
          document.getElementById('gameThumb').value = game.thumbnailUrl || '';
          document.getElementById('gameUrl').value = game.gameUrl || '';
          document.getElementById('gameRating').value = game.rating || 4.8;
          document.getElementById('gameFeatured').value = game.isFeatured ? 'true' : 'false';
          document.getElementById('gamePopular').value = game.isPopular ? 'true' : 'false';
        }
      } else {
        document.getElementById('modalTitle').innerText = 'Add New Game';
        document.getElementById('editGameId').value = '';
        document.getElementById('gameForm').reset();
        document.getElementById('gameId').disabled = false;
        document.getElementById('gameId').value = 'game_' + Date.now();
      }
    }

    function closeGameModal() {
      document.getElementById('gameModal').style.display = 'none';
    }

    function saveGame(e) {
      e.preventDefault();
      const editId = document.getElementById('editGameId').value;
      const gameObj = {
        id: document.getElementById('gameId').value.trim(),
        title: document.getElementById('gameTitle').value.trim(),
        description: document.getElementById('gameDesc').value.trim(),
        category: document.getElementById('gameCategory').value,
        orientation: document.getElementById('gameOrientation').value,
        thumbnailUrl: document.getElementById('gameThumb').value.trim(),
        gameUrl: document.getElementById('gameUrl').value.trim(),
        type: 'html5',
        rating: parseFloat(document.getElementById('gameRating').value) || 4.5,
        isFeatured: document.getElementById('gameFeatured').value === 'true',
        isPopular: document.getElementById('gamePopular').value === 'true',
        playsCount: Math.floor(Math.random() * 20000) + 1000
      };

      if (editId) {
        const idx = currentCatalog.games.findIndex(g => g.id === editId);
        if (idx !== -1) currentCatalog.games[idx] = gameObj;
      } else {
        currentCatalog.games.unshift(gameObj);
      }

      closeGameModal();
      renderGames();
      showStatus('Catalog updated locally! Click "Publish / Commit to GitHub" to sync.', 'success');
    }

    function editGame(id) {
      openGameModal(id);
    }

    function deleteGame(id) {
      if (confirm('Are you sure you want to delete this game from the catalog?')) {
        currentCatalog.games = currentCatalog.games.filter(g => g.id !== id);
        renderGames();
        showStatus('Game removed from local catalog.', 'success');
      }
    }

    async function commitToGitHub() {
      saveCredentials();
      const owner = document.getElementById('ghOwner').value.trim();
      const repo = document.getElementById('ghRepo').value.trim();
      const path = document.getElementById('ghPath').value.trim();
      const branch = document.getElementById('ghBranch').value.trim();
      const token = document.getElementById('ghToken').value.trim();

      if (!token) {
        showStatus('GitHub Personal Access Token (PAT) is required to publish changes.', 'error');
        return;
      }

      currentCatalog.lastUpdated = new Date().toISOString().split('T')[0];
      const jsonString = JSON.stringify(currentCatalog, null, 2);
      const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
      const payload = {
        message: `Update games.json database via Devil Game Hub Admin (${currentCatalog.games.length} games)`,
        content: encodedContent,
        branch: branch
      };
      if (currentFileSha) payload.sha = currentFileSha;

      try {
        const res = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.message || res.statusText);
        }

        const resData = await res.json();
        currentFileSha = resData.content.sha;
        showStatus('🚀 Successfully committed and published updated games.json to GitHub! All Android app instances will load these changes automatically!', 'success');
      } catch (err) {
        showStatus(`GitHub Publish Failed: ${err.message}`, 'error');
      }
    }

    function exportJson() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentCatalog, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "games.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }
  </script>
</body>
</html>
